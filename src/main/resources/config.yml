# NeyUPCrystalDamage - multiplier for the damage an end crystal deals to players.
#
# PLACEHOLDERS - work in every text of this file:
#
#   Damage
#     {base_damage}       vanilla damage of the hit, before the multiplier
#     {damage}            final damage dealt to the player
#     {multiplier}        settings.multiplier as it is applied right now
#
#   Service (info, reload)
#     {bypass}            bypass permission node (permissions.bypass)
#     {bypass_state}      state_on / state_off word for permissions.enabled
#     {version}           plugin version from plugin.yml
#     {time}              reload time, ms
#     {prefix}            messages.prefix
#
# HEX colors are supported everywhere: #RRGGBB and &#RRGGBB.

settings:

  enabled: true # Master switch. If false - the plugin does nothing at all

  # Damage multiplier (1.0 = 100%, 4.0 = 400%, 0.1 = 10%).
  # Zero cancels the crystal hit entirely instead of dealing no damage.
  multiplier: 0.1

permissions:

  enabled: false # Enable the permission system: command nodes become active, bypass starts working

  # Players with this node take vanilla crystal damage, the multiplier is not applied
  bypass: "crystal.damage.bypass"

messages:

  enabled: true # Master switch for all plugin messages
  prefix: "" # Substituted into {prefix} inside the texts (empty = no prefix)

  # Word-fragments for the {bypass_state} placeholder inside info (not standalone
  # messages): /crystaldamage info assembles the line "Bypass: <state_on|state_off>"
  state_on:
    enabled: true
    text: "&aenabled"

  state_off:
    enabled: true
    text: "&cdisabled"

  # Sent to the player right before the multiplied damage is applied
  message_before_damage:
    enabled: true
    text:
      - ""
      - " #5dff52[⛄] &fBoom! Be more careful next time! "
      - ""

  no_permission:
    enabled: true
    text: "{prefix}&#ff6b6bYou do not have permission to do this."

  usage:
    enabled: true
    text:
      - "{prefix}&#8ce0ffNeyUPCrystalDamage commands:"
      - "&f/crystaldamage reload &8- &7reload the configuration"
      - "&f/crystaldamage info &8- &7current multiplier and bypass state"

  reload:
    enabled: true
    text: "{prefix}&#9dff8cConfiguration reloaded &7({time} ms)."

  info:
    enabled: true
    text: "{prefix}&7Version: &f{version}\n&7Multiplier: &f{multiplier}\n&7Bypass: &f{bypass_state} &8({bypass})"
